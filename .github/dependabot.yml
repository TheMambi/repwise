version: 2
# Version updates open against dev, the working branch, so they reach main the same way as other changes.
# Security updates are separate: GitHub opens those against the default branch and does not read target-branch.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Major bumps need deliberate migration; do them by hand. docs/UPGRADES.md lists the ones waiting.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
