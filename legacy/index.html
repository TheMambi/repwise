<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Repwise: generate your custom home workout plan dynamically.">
    <title>Repwise | Custom Home Workout Plan</title>
    <!-- Modern Typography -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color-light: rgba(255, 255, 255, 0.05);
            --surface-color-heavy: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);

            --accent-primary: #3b82f6;
            /* Blue */
            --accent-secondary: #8b5cf6;
            /* Purple */
            --accent-glow: rgba(59, 130, 246, 0.5);

            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;

            --border-radius: 16px;
            --transition-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 2rem;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Outfit', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 1s ease;
        }

        header h1 {
            font-size: 3.5rem;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-primary));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: var(--surface-color-light);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
            animation: fadeInUp 1s ease;
            position: relative;
            overflow: hidden;
        }

        /* Input Grid */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-group select,
        .input-group input {
            background: var(--surface-color-heavy);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 1rem;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all var(--transition-speed);
        }

        .input-group select:focus,
        .input-group input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .input-group select option {
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        /* Checkbox Group for Multiple Selections */
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--surface-color-heavy);
            padding: 0.6rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all var(--transition-speed);
            font-size: 0.9rem;
        }

        .checkbox-label:hover {
            border-color: var(--accent-primary);
            background: rgba(59, 130, 246, 0.2);
        }

        .checkbox-label input {
            display: none;
        }

        .checkbox-label input:checked+span {
            color: var(--accent-primary);
            font-weight: 600;
        }

        .checkbox-label.selected {
            border-color: var(--accent-primary);
            background: rgba(59, 130, 246, 0.2);
        }

        /* Generate Button */
        button.generate-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            padding: 1.2rem 2.5rem;
            font-size: 1.2rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            margin-top: 2rem;
            transition: all var(--transition-speed);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        button.generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px var(--accent-glow);
        }

        button.generate-btn:active {
            transform: translateY(1px);
        }

        /* Results Area */
        #results-container {
            display: none;
            /* Hidden until generated */
        }

        .plan-header {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            color: var(--text-primary);
            border-bottom: 2px solid var(--surface-color-heavy);
            padding-bottom: 1rem;
        }

        /* Workout Day Card */
        .day-card {
            background: var(--surface-color-light);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 2rem;
            margin-bottom: 1.5rem;
            transition: transform var(--transition-speed);
        }

        .day-card:hover {
            transform: translateY(-5px);
            background: var(--surface-color-heavy);
        }

        .day-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .day-title h3 {
            font-size: 1.5rem;
            color: var(--accent-primary);
        }

        .day-focus {
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Exercise Item */
        .exercise-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent-secondary);
            cursor: pointer;
            transition: all var(--transition-speed);
        }

        .exercise-item:hover {
            background: rgba(0, 0, 0, 0.4);
            border-left-color: var(--accent-primary);
        }

        .ex-info h4 {
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }

        .ex-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            gap: 1rem;
        }

        .ex-meta span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        /* Modal for Exercise Details */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-speed);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--surface-color-heavy);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 2.5rem;
            width: 90%;
            max-width: 500px;
            transform: translateY(20px);
            transition: transform var(--transition-speed);
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-modal:hover {
            color: var(--text-primary);
        }

        .modal-content h2 {
            margin-bottom: 1rem;
            color: var(--accent-primary);
        }

        .modal-desc {
            color: var(--text-primary);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .modal-img-placeholder {
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-secondary);
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .day-title {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .exercise-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>Repwise</h1>
            <p>Your personalized weekly training plan using Calisthenics & Weights.</p>
        </header>

        <!-- Input Form -->
        <main class="glass-panel" id="input-panel">
            <div class="form-grid">

                <!-- Time Input -->
                <div class="input-group">
                    <label for="time"><i class="fa-regular fa-clock"></i> Available Time</label>
                    <select id="time">
                        <option value="15">15 Minutes (Express)</option>
                        <option value="30" selected>30 Minutes (Standard)</option>
                        <option value="45">45 Minutes (Extended)</option>
                        <option value="60">60 Minutes (Full Session)</option>
                    </select>
                </div>

                <!-- Goal Input -->
                <div class="input-group">
                    <label for="goal"><i class="fa-solid fa-bullseye"></i> Goal</label>
                    <select id="goal">
                        <option value="growth">Muscle Growth (Hypertrophy)</option>
                        <option value="definition">Muscle Definition (Endurance/Burn)</option>
                    </select>
                </div>

                <!-- Days Per Week Input -->
                <div class="input-group">
                    <label for="days"><i class="fa-regular fa-calendar"></i> Days Per Week</label>
                    <select id="days">
                        <option value="2">2 Days</option>
                        <option value="3" selected>3 Days</option>
                        <option value="4">4 Days</option>
                        <option value="5">5 Days</option>
                        <option value="6">6 Days</option>
                        <option value="7">7 Days</option>
                    </select>
                </div>

                <!-- Equipment Input (Checkboxes) -->
                <div class="input-group" style="grid-column: 1 / -1;">
                    <label><i class="fa-solid fa-dumbbell"></i> Available Equipment</label>
                    <div class="checkbox-group" id="equipment-group">
                        <label class="checkbox-label selected">
                            <input type="checkbox" value="None" checked> <span>Bodyweight (None)</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" value="Dumbbells"> <span>Dumbbells</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" value="Pull-up Bar"> <span>Pull-up Bar</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" value="Resistance Band"> <span>Resistance Band</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" value="TRX"> <span>TRX / Rings</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" value="Bench"> <span>Bench</span>
                        </label>
                    </div>
                </div>

                <!-- Muscle Group Focus (Checkboxes) -->
                <div class="input-group" style="grid-column: 1 / -1;">
                    <label><i class="fa-solid fa-child"></i> Focus Muscle Groups</label>
                    <div class="checkbox-group" id="muscle-group">
                        <label class="checkbox-label selected">
                            <input type="checkbox" value="Push" checked> <span>Push (Chest/Shoulders/Triceps)</span>
                        </label>
                        <label class="checkbox-label selected">
                            <input type="checkbox" value="Pull" checked> <span>Pull (Back/Biceps)</span>
                        </label>
                        <label class="checkbox-label selected">
                            <input type="checkbox" value="Legs" checked> <span>Legs (Quads/Hams/Glutes)</span>
                        </label>
                        <label class="checkbox-label selected">
                            <input type="checkbox" value="Core" checked> <span>Core (Abs)</span>
                        </label>
                    </div>
                </div>

            </div>

            <button class="generate-btn" id="generate-btn">
                <i class="fa-solid fa-bolt"></i> Generate Weekly Plan
            </button>
        </main>

        <!-- Results Display -->
        <section id="results-container">
            <h2 class="plan-header">Your Custom Plan</h2>
            <div id="plan-days">
                <!-- Dynamically populated -->
            </div>

            <button class="generate-btn" id="reset-btn"
                style="background: var(--surface-color-light); border: 1px solid var(--glass-border); margin-bottom: 4rem;">
                <i class="fa-solid fa-redo"></i> Adjust Plan Options
            </button>
        </section>

    </div>

    <!-- Interactive Exercise Modal -->
    <div class="modal-overlay" id="exercise-modal">
        <div class="modal-content">
            <span class="close-modal" id="close-modal"><i class="fa-solid fa-times"></i></span>
            <div class="modal-img-placeholder" id="modal-img">
                <i class="fa-solid fa-image"></i>
            </div>
            <h2 id="modal-title">Exercise Title</h2>
            <div class="ex-meta" style="margin-bottom: 1rem; color: var(--accent-primary);">
                <span id="modal-muscle"><i class="fa-solid fa-child"></i> Muscle</span>
                <span id="modal-equip"><i class="fa-solid fa-dumbbell"></i> Equipment</span>
            </div>
            <p class="modal-desc" id="modal-desc">Exercise description goes here.</p>
            <div
                style="display:flex; justify-content: space-between; border-top: 1px solid var(--glass-border); padding-top: 1rem;">
                <div id="modal-sets-reps" style="font-weight:bold;">3 Sets x 10 Reps</div>
                <div id="modal-rest" style="color:var(--text-secondary);">Rest: 60s</div>
            </div>
        </div>
    </div>

    <!-- External DB Script -->
    <script src="data/exercises.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            /* --- Checkbox Selection UI Logic --- */
            document.querySelectorAll('.checkbox-label input').forEach(input => {
                input.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        e.target.parentElement.classList.add('selected');
                    } else {
                        e.target.parentElement.classList.remove('selected');
                    }
                });
            });

            /* --- Navigation / Brain Logic --- */
            const generateBtn = document.getElementById('generate-btn');
            const resetBtn = document.getElementById('reset-btn');
            const inputPanel = document.getElementById('input-panel');
            const resultsContainer = document.getElementById('results-container');
            const planDaysContainer = document.getElementById('plan-days');
            const modal = document.getElementById('exercise-modal');
            const closeModalBtn = document.getElementById('close-modal');

            // B.L.A.S.T Navigation (Decision Maker)
            generateBtn.addEventListener('click', () => {

                // 1. Gather Inputs
                const timeStr = document.getElementById('time').value;
                const timeMins = parseInt(timeStr);
                const goal = document.getElementById('goal').value;
                const daysPerWeek = parseInt(document.getElementById('days').value);

                // Get checked equipment
                const eqInputs = document.querySelectorAll('#equipment-group input:checked');
                const availableEquipment = Array.from(eqInputs).map(i => i.value);
                // "None" is always available implicitly, but let's ensure it.
                if (!availableEquipment.includes("None")) availableEquipment.push("None");

                // Get checked muscles
                const msInputs = document.querySelectorAll('#muscle-group input:checked');
                const focusMuscles = Array.from(msInputs).map(i => i.value);

                if (focusMuscles.length === 0) {
                    alert("Please select at least one muscle group to focus on.");
                    return;
                }

                // 2. Logic: Database Filtering
                let db = window.exercisesData || [];

                // Filter DB down to exercises where equipment is implicitly matched 
                // i.e., the exercise equipment string mentions one of the available items
                const validExercises = db.filter(ex => {
                    const reqEq = ex.equipment.toLowerCase();
                    return availableEquipment.some(eq => reqEq.includes(eq.toLowerCase()));
                });

                // 3. Logic: Volume Calculation
                // Assume 1 exercise takes ~5 mins including sets and rest.
                const totalExercisesPerDay = Math.max(2, Math.floor(timeMins / 5));

                // 4. Logic: Set/Rep Scheme by Goal
                let sets = 3;
                let reps = "8-12";
                let rest = "90s";
                if (goal === 'definition') {
                    sets = 4;
                    reps = "15-20";
                    rest = "45s";
                }

                // 5. Structure Weekly Routine (Layer 3: Tools/Assembly)
                // Distribute selected muscle groups across the chosen days per week.
                const allDays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
                const daysOfWeek = allDays.slice(0, daysPerWeek);
                let weeklyPlan = [];

                focusMuscles.forEach((muscle, index) => {
                    const dayName = daysOfWeek[index % daysOfWeek.length];

                    // Get exercises for THIS muscle
                    let muscleExercises = validExercises.filter(ex => ex.category === muscle);

                    // Fallback if no matching exercises found
                    if (muscleExercises.length === 0) {
                        muscleExercises = db.filter(ex => ex.category === muscle && ex.equipment === "None");
                    }

                    // Shuffle array safely and pick totalExercisesPerDay
                    let shuffled = muscleExercises.sort(() => 0.5 - Math.random());
                    let dayExercises = shuffled.slice(0, totalExercisesPerDay);

                    weeklyPlan.push({
                        day: dayName,
                        focus: muscle + " Day",
                        exercises: dayExercises.map(ex => ({
                            ...ex,
                            sets: sets,
                            reps: reps,
                            rest: rest
                        }))
                    });
                });

                // 6. UI Rendering (Phase 4: Stylize)
                renderPlan(weeklyPlan);

                // Transition UI
                inputPanel.style.display = 'none';
                resultsContainer.style.display = 'block';
                resultsContainer.style.animation = 'fadeInUp 1s ease';
            });

            resetBtn.addEventListener('click', () => {
                resultsContainer.style.display = 'none';
                inputPanel.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            closeModalBtn.addEventListener('click', () => {
                modal.classList.remove('active');
            });

            // Close modal on outside click
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('active');
            });

            function renderPlan(plan) {
                planDaysContainer.innerHTML = '';

                if (plan.length === 0) {
                    planDaysContainer.innerHTML = '<p style="text-align:center;">Not enough data to match your criteria. Please select more equipment or muscle groups.</p>';
                    return;
                }

                plan.forEach(dayInfo => {
                    const dayCard = document.createElement('div');
                    dayCard.className = 'day-card';

                    let exercisesHtml = '';

                    if (dayInfo.exercises.length === 0) {
                        exercisesHtml = `<div class="exercise-item"><div class="ex-info"><p style="color:var(--text-secondary)">No exercises found for this combination.</p></div></div>`;
                    } else {
                        dayInfo.exercises.forEach((ex, idx) => {
                            // Store object in data attribute for modal
                            const exData = encodeURIComponent(JSON.stringify(ex));

                            // For visualization, we select an icon depending on Category
                            let icon = 'fa-dumbbell';
                            if (ex.category === 'Pull') icon = 'fa-arrow-up';
                            if (ex.category === 'Push') icon = 'fa-arrow-down';
                            if (ex.category === 'Core') icon = 'fa-fire';
                            if (ex.category === 'Legs') icon = 'fa-shoe-prints';

                            exercisesHtml += `
                            <div class="exercise-item" data-ex="${exData}" onclick="openModal(this)">
                                <div class="ex-info">
                                    <h4>${idx + 1}. ${ex.name}</h4>
                                    <div class="ex-meta">
                                        <span><i class="fa-solid fa-layer-group"></i> ${ex.sets}x${ex.reps}</span>
                                        <span><i class="fa-solid ${icon}"></i> ${ex.equipment}</span>
                                    </div>
                                </div>
                                <div style="color: var(--accent-primary); font-size: 1.2rem;">
                                    <i class="fa-solid fa-chevron-right"></i>
                                </div>
                            </div>
                            `;
                        });
                    }

                    dayCard.innerHTML = `
                        <div class="day-title">
                            <h3>${dayInfo.day}</h3>
                            <span class="day-focus">${dayInfo.focus}</span>
                        </div>
                        <div class="exercise-list">
                            ${exercisesHtml}
                        </div>
                    `;

                    planDaysContainer.appendChild(dayCard);
                });
            }
        });

        // Global Modal Function
        window.openModal = function (element) {
            const rawData = element.getAttribute('data-ex');
            if (!rawData) return;

            const exInfo = JSON.parse(decodeURIComponent(rawData));

            document.getElementById('modal-title').textContent = exInfo.name;
            document.getElementById('modal-desc').textContent = exInfo.description;
            document.getElementById('modal-muscle').innerHTML = `<i class="fa-solid fa-child"></i> Primary: ${exInfo.primary_muscle}`;
            document.getElementById('modal-equip').innerHTML = `<i class="fa-solid fa-dumbbell"></i> Eq: ${exInfo.equipment}`;
            document.getElementById('modal-sets-reps').textContent = `${exInfo.sets} Sets x ${exInfo.reps} Reps`;
            document.getElementById('modal-rest').textContent = `Rest: ${exInfo.rest}`;

            // Add dynamic icon based on category for placeholder
            let iconCode = 'fa-image';
            if (exInfo.category === 'Legs') iconCode = 'fa-shoe-prints';
            if (exInfo.category === 'Core') iconCode = 'fa-fire';
            if (exInfo.category === 'Pull') iconCode = 'fa-arrow-up';
            if (exInfo.category === 'Push') iconCode = 'fa-arrow-down';

            document.getElementById('modal-img').innerHTML = `<i class="fa-solid ${iconCode}"></i>`;

            document.getElementById('exercise-modal').classList.add('active');
        };
    </script>
</body>

</html>
